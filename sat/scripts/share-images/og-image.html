<!doctype html>
<!-- Modelo da imagem Open Graph (1200×630). Gerada por scripts/make-share-images.sh → /og-image.png
     e, com ?lang=en, → /og-image-en.png.
     O exemplo é insatisfazível e a árvore é a que o DLL
     da ferramenta desenha para ele (p → F; ¬p → q → F, F); confirmar com solveDLL se o mudares. -->
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
  <link rel="stylesheet" href="../../css/app.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      font-family: var(--font-sans);
      color: var(--color-text);
      background: var(--color-bg);
      display: grid;
      grid-template-columns: 1fr 420px;
      gap: 56px;
      padding: 72px 80px;
      border-top: 12px solid var(--color-ink);
    }
    .eyebrow { font-size: 24px; font-weight: 500; color: var(--color-text-muted); }
    h1 { margin-top: 20px; font-size: 58px; line-height: 1.08; font-weight: 600; letter-spacing: -0.03em; }
    h1 span { white-space: nowrap; }
    .lead { margin-top: 24px; font-size: 28px; line-height: 1.4; color: var(--color-text-muted); }
    .set {
      margin-top: 32px; display: inline-block; padding: 14px 20px; border-radius: 10px;
      font-family: var(--font-mono); font-size: 22px; line-height: 1.5; background: var(--color-surface-2);
    }
    .byline { position: absolute; left: 80px; bottom: 48px; font-size: 22px; color: var(--color-text-muted); }
    .byline strong { color: var(--color-text); font-weight: 600; }
    .tree { align-self: center; }
    .tree text { font-family: var(--font-mono); font-size: 24px; }
  </style>
</head>
<body>
  <div>
    <p class="eyebrow">Lógica proposicional · SAT</p>
    <h1>Learn <span>Davis-Putnam</span> SAT</h1>
    <p class="lead">O algoritmo DLL passo a passo: propagação unitária, ramificação e conflitos.</p>
    <p class="set">{p ∨ q ∨ r, p ∨ q ∨ ¬r, p ∨ ¬q ∨ r,<br>p ∨ ¬q ∨ ¬r, ¬p ∨ q, ¬p ∨ ¬q}</p>
  </div>
  <svg class="tree" viewBox="-10 0 440 400" width="420" height="400" aria-hidden="true">
    <g stroke="var(--color-border-strong)" stroke-width="2" fill="none">
      <path d="M210 60 L110 200"/><path d="M210 60 L310 200"/>
      <path d="M310 200 L250 330"/><path d="M310 200 L370 330"/>
    </g>
    <g font-weight="500">
      <rect x="160" y="30" width="100" height="56" rx="12" fill="var(--color-bg)" stroke="var(--color-text-muted)" stroke-width="2"/>
      <text x="210" y="67" text-anchor="middle" fill="var(--color-text)">p</text>
      <rect x="60" y="172" width="100" height="56" rx="12" fill="var(--color-ev-conflict-soft)" stroke="var(--color-ev-conflict)" stroke-width="2"/>
      <text x="110" y="209" text-anchor="middle" fill="var(--color-ev-conflict)">F</text>
      <rect x="260" y="172" width="100" height="56" rx="12" fill="var(--color-bg)" stroke="var(--color-text-muted)" stroke-width="2"/>
      <text x="310" y="209" text-anchor="middle" fill="var(--color-text)">q</text>
      <rect x="200" y="302" width="100" height="56" rx="12" fill="var(--color-ev-conflict-soft)" stroke="var(--color-ev-conflict)" stroke-width="2"/>
      <text x="250" y="339" text-anchor="middle" fill="var(--color-ev-conflict)">F</text>
      <rect x="320" y="302" width="100" height="56" rx="12" fill="var(--color-ev-conflict-soft)" stroke="var(--color-ev-conflict)" stroke-width="2"/>
      <text x="370" y="339" text-anchor="middle" fill="var(--color-ev-conflict)">F</text>
    </g>
    <g font-size="20" fill="var(--color-text-muted)">
      <text x="140" y="130" text-anchor="end">p</text><text x="280" y="130">¬p</text>
      <text x="262" y="272" text-anchor="end">q</text><text x="356" y="272">¬q</text>
    </g>
  </svg>
  <p class="byline"><span id="byline">Desenvolvido por</span> <strong>Miguel Rocha</strong> · miguelrocha.dev</p>
  <script>
    if (new URLSearchParams(location.search).get("lang") === "en") {
      document.documentElement.lang = "en";
      document.querySelector(".eyebrow").textContent = "Propositional logic · SAT";
      document.querySelector(".lead").textContent = "The DLL algorithm step by step: unit propagation, branching and conflicts.";
      document.querySelector("#byline").textContent = "Developed by";
    }
  </script>
</body>
</html>
